[tool.poetry]
name = "backlight-mcp"
version = "0.1.0"
description = "MCP server for controlling keyboard backlight via sysfs LED nodes"
authors = []
packages = [{include = "backlight_mcp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
mcp = {extras = ["cli"], version = "^1.0"}
python-dotenv = "^1.0"

[tool.poetry.scripts]
backlight-mcp = "backlight_mcp.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
